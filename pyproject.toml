[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bot-coms"
version = "0.1.0"
description = "Standalone filesystem-spool bot-to-bot messaging with atomic enqueue, exclusive claim, and idempotent effects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jason McNeal" }]
keywords = ["messaging", "spool", "hermes", "bot"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-timeout>=2.0"]
backend = ["fastapi>=0.115", "PyYAML>=6", "httpx>=0.27"]
messaging = ["fastapi>=0.115", "PyYAML>=6", "httpx>=0.27"]

[project.scripts]
bot-coms = "bot_coms.cli:main"
bot-coms-board = "bot_coms_board.cli:main"
bot-coms-messaging = "bot_coms_messaging.cli:main"
bot-coms-messaging-worker = "bot_coms_messaging.worker:main"

[project.entry-points."hermes_agent.plugins"]
bot-coms = "hermes_bot_coms"
bot-coms-board = "hermes_bot_coms_board"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_coms", "src/bot_coms_board", "src/bot_coms_messaging", "src/bot_coms_runtime"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.hatch.build.targets.wheel.force-include]
"adapters/hermes_bot_coms" = "hermes_bot_coms"
"adapters/hermes_bot_coms_board" = "hermes_bot_coms_board"
"adapters/hermes_bot_coms_messaging" = "hermes_bot_coms_messaging"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "--import-mode=importlib"
markers = [
    "timeout: pytest-timeout override",
]
